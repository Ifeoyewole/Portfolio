name: OrbitNode v2 checks

on:
  push:
    branches: ["feat/orbitnode-v2-studio"]
  pull_request:
    paths:
      - "src/**"
      - "package.json"
      - "tsconfig.json"
      - "next.config.ts"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - run: npm run smoke

